# Builds the game and publishes dist/ to GitHub Pages (Actions source).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress run: killing actions/deploy-pages mid-flight can
# leave the Pages deployment stuck and block the next one until it times out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Never a literal here: `.nvmrc` is the one place the version lives,
          # and it is what a contributor's `nvm use` reads, so the runner and
          # the laptop cannot drift onto different majors.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # One github-pages environment serves the live site, so only main may publish;
    # a manual run from any other ref builds for validation and stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
